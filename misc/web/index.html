<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lang (WASM)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#0b0f14; color:#d7e0ea; }
  header { padding: 14px 16px; border-bottom: 1px solid #1f2a36; display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header button { background:#1f6feb; border:0; color:#fff; padding:8px 10px; border-radius:8px; cursor:pointer; }
  header button.secondary { background:#1f2a36; color:#d7e0ea; }
  header button:disabled { opacity:.6; cursor:default; }
  main { display:grid; grid-template-columns: 1fr; gap: 12px; padding: 12px; }
  .panel { border:1px solid #1f2a36; border-radius:12px; overflow:hidden; }
  .panel h2 { margin:0; padding:10px 12px; font-size: 12px; background:#0f1620; border-bottom:1px solid #1f2a36; color:#9fb3c8; }
  pre { margin:0; padding:12px; height:68vh; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  textarea { width:100%; border:0; outline:0; resize:none; padding:12px; background:#0b0f14; color:#d7e0ea; font: inherit; }
  .prompt { display:flex; gap: 10px; align-items: stretch; border-top: 1px solid #1f2a36; background:#0b0f14; }
  .prompt .ps1 { padding: 12px 0 12px 12px; color:#7f93a8; user-select:none; }
  .prompt textarea { flex: 1; padding-left: 0; min-height: 44px; height: 44px; }
  .muted { color:#7f93a8; }
  .kbd { color:#9fb3c8; font-size: 12px; }
</style>

<header>
  <h1>Lang WASM REPL</h1>
  <button id="run" disabled>Run</button>
  <button id="clear" class="secondary" disabled>Clear</button>
  <button id="reset" class="secondary" disabled>Reset</button>
  <button id="ex1" class="secondary" disabled>Ex: hello</button>
  <button id="ex2" class="secondary" disabled>Ex: !10</button>
  <button id="ex3" class="secondary" disabled>Ex: lambda</button>
  <span id="status" class="muted">Loading...</span>
  <span class="kbd muted">Enter: run | Shift+Enter: newline | Up/Down: history</span>
</header>

<main>
  <section class="panel">
    <h2>Terminal</h2>
    <pre id="term"></pre>
    <div class="prompt">
      <div class="ps1"> </div>
      <textarea id="prompt" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type Lang code..."></textarea>
    </div>
  </section>
</main>

<script type="module" src="./lang.js"></script>
